# ============================================================
#  CONTENT MANAGER CONFIG
#  Edit the two placeholders below, then you can write posts at
#  https://www.ankurtripathi.net/admin/
# ============================================================

backend:
  name: github
  repo: ankurt23388/Website
  branch: main
  base_url: https://sveltia-cms-auth.ankurt23388.workers.dev
  # After you deploy the auth worker (see README step 5), paste its URL here:
  # base_url: https://sveltia-cms-auth.YOURSUBDOMAIN.workers.dev

# Where uploaded images are stored / referenced
media_folder: "public/images"
public_folder: "/images"

collections:
  # ---------- ARTICLES (written blog posts) ----------
  - name: articles
    label: "Articles"
    label_singular: "Article"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}  ·  {{category}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: description, label: "Short description (shows on cards & in search)", widget: text }
      - { name: category, label: "Category", widget: select, options: ["SEO & AEO", "Content", "Growth", "Lifecycle", "Wealth & Fintech"] }
      - { name: pubDate, label: "Publish date", widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: author, label: "Author", widget: string, default: "Ankur Tripathi" }
      - { name: readTime, label: "Read time", widget: string, required: false, hint: "e.g. 6 min" }
      - { name: cover, label: "Top banner image", widget: image, required: false, hint: "Wide image shown at the top of the post" }
      - { name: draft, label: "Draft (hide until ready)", widget: boolean, default: false }
      - { name: body, label: "Body", widget: markdown, hint: "Use headings, bullets, images, quotes — the toolbar has everything." }

  # ---------- CAROUSELS & INFOGRAPHICS (image posts) ----------
  - name: visuals
    label: "Carousels & Infographics"
    label_singular: "Visual"
    folder: "src/content/visuals"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}  ·  {{type}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: category, label: "Category", widget: select, options: ["SEO & AEO", "Content", "Growth", "Lifecycle", "Wealth & Fintech"] }
      - { name: type, label: "Type", widget: select, options: ["carousel", "infographic"], hint: "infographic = 1 image · carousel = several images" }
      - { name: pubDate, label: "Publish date", widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: cover, label: "Card thumbnail", widget: image, required: false }
      - name: images
        label: "Images"
        widget: list
        hint: "Add one image for an infographic, or several for a carousel (in order)."
        field: { name: image, label: "Image", widget: image }
      - { name: draft, label: "Draft", widget: boolean, default: false }
